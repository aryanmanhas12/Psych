<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -30 520 170" width="1040" height="340">
  <title>Ronak</title>
  <!-- Ronak — the bloom-sun.
     "Ronak" means radiance, glow, the brightness that arrives when a place
     comes alive. Six petals, pink and violet, turn around one gold light;
     gold rays reach past them. Read it as a sunrise or as a flower opening:
     both are the same idea, something growing towards light. -->
  <defs>
    <linearGradient id="rkPk" x1="0" y1="-16" x2="0" y2="-102" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF1470"/><stop offset=".55" stop-color="#FF4F9A"/><stop offset="1" stop-color="#FFB0D6"/>
    </linearGradient>
    <linearGradient id="rkVi" x1="0" y1="-16" x2="0" y2="-102" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B16D6"/><stop offset=".55" stop-color="#8D5CFF"/><stop offset="1" stop-color="#D4C0FF"/>
    </linearGradient>
    <linearGradient id="rkGo" x1="0" y1="-32" x2="0" y2="-114" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF8A00"/><stop offset="1" stop-color="#FFE45C"/>
    </linearGradient>
    <radialGradient id="rkCore" cx="0" cy="0" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFBE3"/><stop offset=".45" stop-color="#FFD83F"/><stop offset="1" stop-color="#FF9F1C"/>
    </radialGradient>
    <path id="rkPetal" d="M0 -16 C42 -38 48 -84 16 -102 C-12 -90 -38 -50 0 -16Z"/>
    <path id="rkRay" d="M0 -32 C10 -56 10 -86 0 -114 C-10 -86 -10 -56 0 -32Z"/>
  </defs>
  
  <g fill="none" stroke="#FFF6EE" stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 100 V10 H40 A25 25 0 0 1 40 60 H10 M36 60 L64 100"/>
    <path d="M210 100 V10 L268 100 V10"/>
    <path d="M294 100 L328 10 L362 100 M306 70 H350"/>
    <path d="M390 10 V100 M442 10 L392 62 M411 42 L446 100"/>
  </g>
  <g transform="translate(136 55) scale(0.56)">
    <g fill="url(#rkGo)"><use href="#rkRay" transform="rotate(30)"/><use href="#rkRay" transform="rotate(90)"/><use href="#rkRay" transform="rotate(150)"/><use href="#rkRay" transform="rotate(210)"/><use href="#rkRay" transform="rotate(270)"/><use href="#rkRay" transform="rotate(330)"/></g>
    <g style="mix-blend-mode:screen"><use href="#rkPetal" fill="url(#rkPk)" transform="rotate(0)"/><use href="#rkPetal" fill="url(#rkVi)" transform="rotate(60)"/><use href="#rkPetal" fill="url(#rkPk)" transform="rotate(120)"/><use href="#rkPetal" fill="url(#rkVi)" transform="rotate(180)"/><use href="#rkPetal" fill="url(#rkPk)" transform="rotate(240)"/><use href="#rkPetal" fill="url(#rkVi)" transform="rotate(300)"/></g>
    <circle r="38" fill="#FFD43B" opacity=".2"/>
    <circle r="30" fill="url(#rkCore)"/>
  </g>
</svg>
