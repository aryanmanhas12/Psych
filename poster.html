<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Printable Poster — Psych Screener</title>
<meta name="description" content="A printable A4 poster in six languages linking to free, private mental health screening. For clinic walls, colleges, and waiting rooms.">
<meta name="author" content="Aryan Manhas">
<style>
@font-face{font-family:'Anton';font-style:normal;font-weight:400;font-display:swap;src:url('anton.woff2') format('woff2');}
:root{--ink:#151C2E;--paper:#F6F4EE;--marigold:#E6A11C;--stamp:#B23A2E;--heal:#2F6E5E;--line:#D8D3C6;--muted:#54596A;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#e9e7e1;color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI','Noto Sans',Roboto,Arial,sans-serif;line-height:1.5;}
.bar{background:var(--ink);color:var(--paper);padding:14px 0;}
.bar .in{max-width:1000px;margin:0 auto;padding:0 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
.bar h1{font-family:'Anton',sans-serif;font-size:19px;text-transform:uppercase;letter-spacing:.04em;margin-right:auto;}
.bar .accent{color:var(--marigold);}
.bar label{font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;}
select,button.act{font-family:system-ui,sans-serif;font-size:14px;padding:7px 12px;background:var(--paper);color:var(--ink);border:2px solid var(--paper);cursor:pointer;}
button.act{background:var(--marigold);border-color:var(--marigold);font-weight:700;}
.hint{max-width:1000px;margin:16px auto 0;padding:0 20px;font-size:14px;color:#3d4354;}

/* ── the sheet: exact A4 ── */
.sheet{
  width:210mm;min-height:297mm;margin:18px auto;background:var(--paper);
  padding:14mm 15mm;display:flex;flex-direction:column;
  box-shadow:0 3px 18px rgba(0,0,0,.18);
}
.eyebrow{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10pt;letter-spacing:.16em;
  text-transform:uppercase;color:var(--stamp);border-bottom:2px solid var(--stamp);padding-bottom:5px;margin-bottom:7mm;}
.head{font-family:'Anton',sans-serif;font-size:30pt;line-height:1.06;text-transform:uppercase;text-wrap:balance;}
.head .g{color:var(--heal);}
[lang=hi] .head,[lang=mr] .head,[lang=bn] .head,[lang=ta] .head,[lang=te] .head{
  font-family:system-ui,'Noto Sans',sans-serif;font-weight:800;text-transform:none;font-size:24pt;line-height:1.3;}
.sub{font-size:12pt;margin-top:4mm;max-width:150mm;}

.mid{display:flex;gap:10mm;margin:7mm 0 6mm;align-items:center;}
.qr{width:66mm;flex:none;border:2.5px solid var(--ink);padding:3.5mm;background:#fff;}
.qr svg{width:100%;height:auto;display:block;}
.qrcap{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:8.5pt;text-align:center;margin-top:2.5mm;letter-spacing:.03em;word-break:break-all;}
.pts{flex:1;}
.pt{display:flex;gap:4mm;align-items:flex-start;margin-bottom:4.5mm;}
.pt .n{font-family:'Anton',sans-serif;font-size:15pt;color:var(--marigold);line-height:1.1;flex:none;width:9mm;}
.pt .t{font-size:11.5pt;}
.checks{border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:4mm 0;margin-bottom:6mm;}
.checks .ct{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:8.5pt;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:3mm;}
.checks .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5mm;}
.checks .c .nm{font-family:'Anton',sans-serif;font-size:13pt;color:var(--heal);}
[lang=hi] .checks .c .nm,[lang=mr] .checks .c .nm,[lang=bn] .checks .c .nm,[lang=ta] .checks .c .nm,[lang=te] .checks .c .nm{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:12pt;}
.checks .c .lb{font-size:9.5pt;line-height:1.35;margin-top:1mm;}

.lines{border:2.5px solid var(--ink);background:#fff;padding:5mm 6mm;margin-top:auto;}
.lines h2{font-family:'Anton',sans-serif;font-size:13pt;text-transform:uppercase;letter-spacing:.03em;margin-bottom:3mm;}
[lang=hi] .lines h2,[lang=mr] .lines h2,[lang=bn] .lines h2,[lang=ta] .lines h2,[lang=te] .lines h2{
  font-family:system-ui,'Noto Sans',sans-serif;font-weight:800;text-transform:none;}
.lines table{width:100%;border-collapse:collapse;font-size:10.5pt;}
.lines td{padding:1.5mm 0;border-bottom:1px solid var(--line);}
.lines tr:last-child td{border-bottom:none;}
.lines .num{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:12.5pt;text-align:right;white-space:nowrap;}
.foot{display:flex;justify-content:space-between;gap:6mm;align-items:flex-end;margin-top:6mm;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:8pt;color:var(--muted);}
.foot .dis{max-width:120mm;line-height:1.45;}

@page{size:A4;margin:0;}
@media print{
  body{background:#fff;}
  .sheet{height:297mm;min-height:0;overflow:hidden;}
  .bar,.hint{display:none!important;}
  .sheet{margin:0;box-shadow:none;width:210mm;min-height:297mm;page-break-after:always;}
}
</style>
</head>
<body>

<div class="bar">
  <div class="in">
    <h1>Psych <span class="accent">Screener</span> — Poster</h1>
    <label for="lang">Language</label>
    <select id="lang"></select>
    <button class="act" onclick="window.print()">Print / Save as PDF</button>
  </div>
</div>
<p class="hint">Pick a language, then print at <strong>A4, 100% scale, no margins</strong>. The QR code has been decode-tested down to 18&nbsp;mm, so it scans reliably at this size. Put it where people wait.</p>

/* Numbers are language-neutral. India first (where this ships), then the
   always-current international directory for everyone else. */
const LINES = [
  ["Tele-MANAS", "14416"],
  ["KIRAN", "1800-599-0019"],
  ["Emergency", "112"],
  ["Anywhere in the world", "findahelpline.com"]
];

function render(code){
  const t = P[code] || P.en;
  const s = document.getElementById("sheet");
  s.lang = code;
  document.documentElement.lang = code;
  document.getElementById("pEyebrow").textContent = t.eyebrow;
  document.getElementById("pHead").innerHTML = t.head;
  document.getElementById("pSub").textContent = t.sub;
  document.getElementById("pPoints").innerHTML = t.points.map((p,i)=>
    `<div class="pt"><span class="n">${i+1}</span><span class="t">${p}</span></div>`).join("");
  document.getElementById("pChecksTitle").textContent = t.checksTitle;
  const NAMES = ["PHQ-9","GAD-7","AUDIT-C","PHQ-4"];
  document.getElementById("pChecks").innerHTML = t.checks.map((c,i)=>
    `<div class="c"><div class="nm">${NAMES[i]}</div><div class="lb">${c}</div></div>`).join("");
  document.getElementById("pLinesTitle").textContent = t.linesTitle;
  document.getElementById("pLines").innerHTML = LINES.map(([n,v])=>
    `<tr><td>${n}</td><td class="num">${v}</td></tr>`).join("");
  document.getElementById("pDisc").textContent = t.disc;
}
const sel = document.getElementById("lang");
Object.keys(P).forEach(c=>{ const o=document.createElement("option"); o.value=c; o.textContent=P[c].label; sel.appendChild(o); });
sel.addEventListener("change", ()=> render(sel.value));
render((navigator.language||"en").slice(0,2) in P ? (navigator.language||"en").slice(0,2) : "en");
sel.value = document.getElementById("sheet").lang;
</script>
